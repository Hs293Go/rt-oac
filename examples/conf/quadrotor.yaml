# RT-OAC quadrotor headline -- Hydra config. The `mode` group bundles feedback/objective/band/
# horizon so the three-mode arc (open -> estimation -> hybrid) is selected by one key, not a
# tangle of flags. Override on the CLI, e.g.:
#   uv run python examples/quadrotor_cooperative_navigation.py mode=hybrid
#   uv run python examples/quadrotor_cooperative_navigation.py mode=estimation steps=120
#   uv run python examples/quadrotor_cooperative_navigation.py mode=open soft=true spawn=true
defaults:
  - mode: open # open | estimation | hybrid  (see conf/mode/)
  - override hydra/job_logging: disabled # no <script>.log in cwd
  - override hydra/hydra_logging: disabled
  - _self_

steps: null # null -> mode.default_steps
spawn: false # launch the live rerun viewer
save: null # record the .rrd to this path (else results/example_quadrotor[_mode].rrd)
soft: false # distance band as a soft penalty + unconstrained L-BFGS-B (vs hard SLSQP)
leader_speed: 2.0 # world-frame level-cruise speed (Galilean-invariant relative orbit)
world_leader: true # closed-loop: level-cruise leader -> genuine absolute world-frame scene
seed: 0 # RNG seed for the closed-loop noise (process/measurement/input)
# Diagnostics isolating the source of the finding-#8 divergence:
#   reanchor=true     -- reset the EKF mean to truth each step (the companion/paper validation:
#                        only the covariance envelope propagates along the fixed OA trajectory;
#                        the mean never drifts, so it cannot diverge). Control sees ~truth.
#   plan_on_truth=true -- carry the EKF mean, but plan the control on TRUTH (open-loop OA traj +
#                        a real carried estimator). Isolates loop-closing from estimator drift.
#   both false (#8)    -- carry the mean AND plan the control on it (the real closed loop).
reanchor: false
plan_on_truth: false
# Annealed "training-wheels" truth-anchor (sim-only): pull the carried EKF mean a fraction
# alpha(i) toward truth via a covariance-consistent pseudo-measurement. alpha(i) = anchor_alpha0
# for anchor_hold steps, then linearly anneals to 0 over anchor_anneal steps (0 = sharp release),
# then 0 (carried). anchor_alpha0=0 disables it. The deployable loop is always alpha=0.
anchor_alpha0: 0.0
anchor_hold: 0
anchor_anneal: 0
# M2 estimator-consistency knobs (deployable, truth-free): fight the position-block over-confidence
# (M0). proc_pos_scale inflates the position process noise; p_pos_floor lower-bounds trace(P[pos])
# additively after each update; fej freezes the EKF Jacobians at a reference re-set every fej_epoch
# steps (First-Estimates Jacobian -- blocks spurious info gain in the unobservable subspace).
proc_pos_scale: 1.0
p_pos_floor: 0.0
fej: false
fej_epoch: 15
filter: ekf # closed-loop estimator: ekf (ErrorStateEKF) | ukf (manifold UKF, derivative-free)
report: null # dir for the report pipeline's <tag>.{npz,json} dump (null = off); see report/

hydra:
  run: { dir: . }
  output_subdir: null
  job: { chdir: false }
